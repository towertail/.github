name: Feature request
description: Suggest a new feature or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem that this feature solves.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature that you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe other solutions that you think about.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - macOS app
        - Windows app
        - Server
        - Sampler
        - Other
